<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X Post Image Maker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>X Post Image Maker</h1>
  <p class="subtitle">Add a visible URL to your image so followers know where to go when they see your post.</p>

  <!-- <div class="tip">
    💡 Since X doesn't support clickable images, make your URL visible directly on the image. Post the image, and put the link in your caption or first reply too.
  </div> -->

  <div class="card">
    <label>Upload your image</label>
    <div class="upload-area" onclick="document.getElementById('file-input').click()">
      <input type="file" id="file-input" accept="image/*">
      <strong id="upload-label">Click to upload image</strong>
      <p>JPG, PNG, WEBP supported</p>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div class="field" style="flex:2; min-width:200px;">
        <label>Destination URL</label>
        <input type="text" id="url-input" placeholder="https://yourlink.com">
      </div>
    </div>
    <div class="row" style="margin-top:14px;">
      <div class="field">
        <label>URL position</label>
        <select id="position">
          <option value="bottom">Bottom</option>
          <option value="top">Top</option>
          <option value="center">Center</option>
        </select>
      </div>
      <div class="field">
        <label>Bar style</label>
        <select id="style">
          <option value="dark">Dark bar, white text</option>
          <option value="light">Light bar, dark text</option>
          <option value="transparent">Transparent dark</option>
        </select>
      </div>
      <div class="field">
        <label>Font size</label>
        <select id="fontsize">
          <option value="16">Small</option>
          <option value="22" selected>Medium</option>
          <option value="30">Large</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <label>Preview</label>
    <canvas id="canvas" width="1200" height="675"></canvas>
    <p class="hint" id="hint">Upload an image to get started</p>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="download-btn" disabled onclick="downloadImage()">⬇ Download image</button>
  </div>
  <p class="hint" style="margin-top:10px;">Save the downloaded image and post it directly on X. Put your link in the tweet caption too for best results.</p>
</div>

<script src="main.js"></script>
</body>
</html>
